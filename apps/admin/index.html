<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mabrur Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F1E8;color:#1F1B16}
    input,select,textarea,button{font-family:inherit}
    a{color:#0B5D47;text-decoration:none}
    /* Satu cincin fokus untuk semua kontrol (pengguna keyboard); emas di sidebar gelap. */
    :focus-visible{outline:2px solid #0B5D47;outline-offset:2px}
    aside :focus-visible{outline-color:#D4A437}
    .dropzone:focus-within{outline:2px solid #0B5D47;outline-offset:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
